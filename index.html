<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Заявки Афсона</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f5f5f7;--card:#fff;--fg:#1c1c1e;--mut:#8e8e93;--line:#ececf0;--acc:#2f7de1;--accfg:#fff;--ok:#2fa84f;--soft:#eaf2fd;--warn:#fff4d6;--warnfg:#5b4300;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d23;--fg:#f2f2f5;--mut:#8b919c;--line:#262a32;--acc:#4a93ec;--soft:#1b2a3f;--ok:#41c262;--warn:#3a3114;--warnfg:#f3dd9a}}
:root.dark{--bg:#0f1115;--card:#1a1d23;--fg:#f2f2f5;--mut:#8b919c;--line:#262a32;--acc:#4a93ec;--soft:#1b2a3f;--ok:#41c262;--warn:#3a3114;--warnfg:#f3dd9a}
:root.light{--bg:#f5f5f7;--card:#fff;--fg:#1c1c1e;--mut:#8e8e93;--line:#ececf0;--acc:#2f7de1;--soft:#eaf2fd;--ok:#2fa84f;--warn:#fff4d6;--warnfg:#5b4300}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font:16px/1.35 -apple-system,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;padding-bottom:110px;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:26px;font-weight:700;margin:22px 0 2px;letter-spacing:-.4px}
.sub{color:var(--mut);font-size:14px;margin-bottom:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:var(--r);padding:18px 16px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line);cursor:pointer;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:30px;line-height:1}
.tile b{font-size:17px;font-weight:650}
.tile small{color:var(--mut);font-size:13px;display:block;margin-top:2px}
.tile .ck{position:absolute;right:12px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;font-size:14px;display:none;align-items:center;justify-content:center}
.tile.done .ck{display:flex}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px}
.bar{display:flex;align-items:center;gap:10px}
.back{border:0;background:var(--card);color:var(--acc);width:38px;height:38px;border-radius:50%;font-size:20px;border:1px solid var(--line)}
.bar h2{margin:0;font-size:21px;font-weight:700;flex:1}
.cnt{color:var(--mut);font-size:14px}
.search{width:100%;margin-top:10px;padding:11px 14px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);outline:none}
.gh{padding:12px 14px 6px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);background:var(--bg)}
.list{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.on{background:var(--soft)}
.row.due .us{color:#e5484d;font-weight:600}
.duebar{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:14px}
.duebar button{margin-top:8px;border:0;background:var(--acc);color:#fff;padding:10px 14px;border-radius:10px;font-size:15px;font-weight:600}
.nm{flex:1;min-width:0;font-weight:560}
.us{color:var(--mut);font-size:12px;font-weight:400;margin-top:1px}
.row input{width:96px;padding:10px 6px;font-size:22px;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);outline:none;font-weight:600}
.row.on input{border-color:var(--acc);background:var(--card)}
.more{margin:14px 2px;color:var(--acc);font-size:15px;background:none;border:0;padding:6px 0}
.free{display:flex;gap:8px;margin-top:8px}
.free input{padding:11px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);outline:none}
.free .fn{flex:1;min-width:0}.free .fq{width:86px;text-align:center}
textarea{width:100%;min-height:64px;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);outline:none;margin-top:10px;font-family:inherit}
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px max(16px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.cta button{display:block;width:100%;max-width:560px;margin:0 auto;padding:16px;font-size:17px;font-weight:650;color:var(--accfg);background:var(--acc);border:0;border-radius:14px;box-shadow:0 4px 14px rgba(47,125,225,.3)}
.cta button:disabled{opacity:.45;box-shadow:none}
.cta .two{display:flex;gap:10px;max-width:560px;margin:0 auto}
.cta .two button{flex:1}
#go2{background:var(--card);color:var(--acc);border:1px solid var(--line);box-shadow:none}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);margin-bottom:12px;overflow:hidden}
.card.off{opacity:.55}
.ch{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.ch .ic{font-size:26px}.ch .t{flex:1}.ch .t b{font-size:17px}.ch .t small{display:block;color:var(--mut);font-size:13px}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex:none}
.chk.on{background:var(--acc);border-color:var(--acc)}
.body{display:none;border-top:1px solid var(--line)}
.card.open .body{display:block}
.empty{padding:40px 10px;text-align:center;color:var(--mut)}
.note{padding:10px 16px;font-size:13px;color:var(--mut);background:var(--soft)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 13px;border-radius:12px;font-size:15px}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.egh{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 4px 6px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
.egh .gb button{border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:9px;padding:5px 9px;margin-left:5px;font-size:13px;text-transform:none;letter-spacing:0;font-weight:500}
.erow .nm{cursor:pointer}
.erow input{width:84px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;max-width:560px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px max(18px,env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:18px}
.sheet label{display:block;font-size:12px;color:var(--mut);margin:8px 0}
.sheet input,.sheet select{display:block;width:100%;margin-top:4px;padding:11px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);outline:none}
.two2{display:flex;gap:10px;margin-top:6px}.two2>*{flex:1}
.sheet button{padding:13px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);margin-top:8px}
.sheet .okb{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:650}
.sheet .danger{color:#e5484d}
.pnl{display:none;padding:10px 14px 12px;background:var(--soft);border-bottom:1px solid var(--line)}
.pnl.open{display:block}
.pnl .pr{display:flex;gap:8px;margin-top:8px}.pnl .pr:first-child{margin-top:0}
.pnl button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px}
.pnl button.on{background:#e5484d;color:#fff;border-color:#e5484d}
.pnl .row input,.pnl input.cn{width:100%;padding:10px;font-size:15px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);outline:none;font-weight:400}
.forg{padding:12px 14px;background:var(--warn);color:var(--warnfg);font-size:14px}
.chip{margin:8px 8px 0 0;padding:8px 12px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;font-size:14px}
#err{padding:60px 20px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="cta" id="cta" style="display:none"><div class="two"><button id="go2" style="display:none"></button><button id="go"></button></div></div>
<script>
let CAT={};const TITLES={'ПОВАР':'Кухня','МАНГАЛ':'Мангал','САЛАТ':'Салат','БАР':'Бар','СКЛАД':'Склад'};
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();try{if(tg.colorScheme)document.documentElement.classList.add(tg.colorScheme==='dark'?'dark':'light')}catch(e){}}
const $=s=>document.querySelector(s);
const app=$('#app'),cta=$('#cta'),go=$('#go'),go2=$('#go2');
const ICON={'ПОВАР':'🍳','МАНГАЛ':'🔥','САЛАТ':'🥗','БАР':'🍹','СКЛАД':'📦'};
function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function inflate(z){const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(b64u(z));w.close();return JSON.parse(await new Response(ds.readable).text())}
function num(v){v=String(v).replace(',','.').trim();const n=parseFloat(v);return isFinite(n)&&n>0?n:null}
function fmt(q){return Number.isInteger(q)?String(q):String(q).replace('.',',')}
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild}
function send(o){const s=JSON.stringify(o);if(tg)tg.sendData(s);else alert(s)}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

/* ---------- сотрудник ---------- */
let S={},R0={},DATE='',Y={},U={},W={};
function filled(f){return f?Object.keys(f.i||{}).filter(k=>num(f.i[k])!==null).length+(f.x||[]).filter(a=>a[0]&&num(a[1])!==null).length:0}
function clean(f){const i={};Object.keys((f&&f.i)||{}).forEach(k=>{const n=num(f.i[k]);if(n!==null)i[k]=n});
  const x=((f&&f.x)||[]).filter(a=>String(a[0]).trim()&&num(a[1])!==null).map(a=>[String(a[0]).trim(),num(a[1])]);
  const u=((f&&f.u)||[]).filter(k=>i[k]!==undefined);const c={};
  Object.keys((f&&f.c)||{}).forEach(k=>{const t=String(f.c[k]).trim();if(t&&i[k]!==undefined)c[k]=t.slice(0,60)});
  const o={i,x,n:((f&&f.n)||'').trim()};if(u.length)o.u=u;if(Object.keys(c).length)o.c=c;return o}
function saveDraft(p){ls('form:'+p+':'+DATE,S[p])}
function blank(){return{i:{},x:[],n:'',u:[],c:{}}}
function staffInit(date,R){DATE=date;R0=R||{};Object.keys(CAT).forEach(p=>{const l=ls('form:'+p+':'+date);
  S[p]=l||(R0[p]?{i:{...R0[p].i},x:(R0[p].x||[]).map(a=>[...a]),n:R0[p].n||'',u:[...(R0[p].u||[])],c:{...(R0[p].c||{})}}:blank())})}
function toSend(){return Object.keys(CAT).filter(p=>filled(S[p])>0||R0[p])}
function staffHome(){
  cta.style.display='none';app.innerHTML='';
  app.append(el(`<h1>Заявка</h1>`),el(`<div class="sub">На ${DATE} · заполните свой пост, затем «Проверить и отправить»</div>`));
  const g=el('<div class="tiles"></div>');
  Object.keys(CAT).forEach(p=>{
    const n=filled(S[p]),was=R0[p]?true:false;
    const t=el(`<div class="tile${n||was?' done':''}"><div class="ck">✓</div><div class="ic">${ICON[p]||'📦'}</div><div><b>${CAT[p].title}</b><small>${n?('заполнено · '+n+' поз.'):(was?'отправлено, пусто':CAT[p].items.length+' позиций')}</small></div></div>`);
    t.onclick=()=>staffPost(p);g.append(t)});
  app.append(g);
  const k=toSend().length;
  go2.style.display='none';cta.style.display='block';go.disabled=!k;go.textContent=k?'Проверить и отправить':'Выберите пост и заполните';go.onclick=staffReview;
}
function staffPost(p){
  const C=CAT[p],F=S[p];F.i=F.i||{};F.x=F.x||[];F.u=F.u||[];F.c=F.c||{};
  app.innerHTML='';
  const top=el(`<div class="top"><div class="bar"><button class="back">‹</button><h2>${C.title}</h2><span class="cnt" id="cnt"></span></div><input class="search" type="search" placeholder="Найти" autocomplete="off"></div>`);
  app.append(top);
  const list=el('<div class="list"></div>'),rows=[];
  let lastG=null;const heads=[];
  C.items.forEach(([name,usual,grp,cyc,par])=>{
    if(grp&&grp!==lastG){const gh=el('<div class="gh"></div>');gh.textContent=grp;list.append(gh);heads.push(gh);lastG=grp}
    const r=el(`<div class="row"><div class="nm"><span></span><div class="us"></div></div><input type="text" inputmode="decimal" placeholder="—"></div>`);
    r.querySelector('span').textContent=name;
    const dueIt=(p==='СКЛАД'&&U[name]);
    const base=dueIt?('пора заказать · норма '+U[name][0]+(U[name][1]?' · в последний раз '+U[name][1]:'')):((usual?('обычно '+usual):'')+(cyc?(' · раз в '+cyc+' дн.'):''));
    const us=r.querySelector('.us');
    const usSet=()=>{us.textContent=base+(F.u.includes(name)?' · ⚡ срочно':'')+(F.c[name]?' · 💬 '+F.c[name]:'')};usSet();
    if(dueIt)r.classList.add('due');
    const inp=r.querySelector('input');if(F.i[name]!==undefined&&F.i[name]!==null)inp.value=String(F.i[name]).replace('.',',');
    const pnl=el(`<div class="pnl"><div class="pr"><button class="ub">⚡ Срочно</button><button class="eb">Закончилось</button></div><div class="pr"><input class="cn" maxlength="60" placeholder="Заметка к позиции, например «помельче»"></div></div>`);
    const ub=pnl.querySelector('.ub'),eb=pnl.querySelector('.eb'),cn=pnl.querySelector('.cn');
    ub.classList.toggle('on',F.u.includes(name));cn.value=F.c[name]||'';
    r.querySelector('.nm').onclick=()=>pnl.classList.toggle('open');
    ub.onclick=()=>{const k=F.u.indexOf(name);if(k>=0)F.u.splice(k,1);else F.u.push(name);ub.classList.toggle('on',k<0);usSet();store()};
    eb.onclick=()=>{inp.value=String(usual||1).replace('.',',');upd();store();pnl.classList.remove('open')};
    cn.oninput=()=>{if(cn.value.trim())F.c[name]=cn.value;else delete F.c[name];usSet();store()};
    const o={name,r,inp,pnl};rows.push(o);inp.oninput=()=>{upd();store()};list.append(r,pnl)});
  app.append(list);
  const freeBox=el('<div></div>'),frees=[];
  if(p==='СКЛАД'&&Object.keys(U).length){
    const names=Object.keys(U);
    const bar=el('<div class="duebar"></div>');bar.textContent='⏰ Пора заказать: '+names.map(n=>n+' '+U[n][0]).join(', ');
    const fb=el('<button>Заполнить то, что пора</button>');
    fb.onclick=()=>{rows.forEach(o=>{if(U[o.name]&&!o.inp.value.trim())o.inp.value=String(U[o.name][0])});upd();store();fb.remove()};
    bar.append(document.createElement('br'),fb);top.after(bar)}
  const has=b=>b&&(Object.keys(b.i||{}).length||(b.x||[]).length);
  const prefill=b=>{rows.forEach(o=>{const v=b.i&&b.i[o.name];if(v!==undefined&&v!==null&&!o.inp.value.trim())o.inp.value=String(v).replace('.',',')});
    (b.x||[]).forEach(a=>addFree(a[0],a[1]));upd();store()};
  const cnt=b=>Object.keys(b.i||{}).filter(k=>C.items.some(it=>it[0]===k)).length+(b.x||[]).length;
  const lb=el('<div></div>');
  const wb=W[p],yb=Y[p];
  if(has(wb)){const btn=el('<button class="more" style="display:block;margin:10px 0 0"></button>');btn.textContent='↺ Как в такой же день недели ('+(wb.d||'')+') · '+cnt(wb)+' поз.';
    btn.onclick=()=>{prefill(wb);btn.remove()};lb.append(btn)}
  if(has(yb)&&!(has(wb)&&JSON.stringify(wb.i)===JSON.stringify(yb.i))){const btn=el('<button class="more" style="display:block;margin:10px 0 0"></button>');btn.textContent='↺ Как в прошлый раз'+(yb.d?' ('+yb.d+')':'')+' · '+cnt(yb)+' поз.';
    btn.onclick=()=>{prefill(yb);btn.remove()};lb.append(btn)}
  if(lb.children.length)top.after(lb);
  function addFree(n,q){const d=el('<div class="free"><input class="fn" placeholder="Другое: название"><input class="fq" inputmode="decimal" placeholder="кол-во"></div>');
    const a=d.querySelector('.fn'),b=d.querySelector('.fq');a.value=n||'';b.value=q===undefined||q===null?'':String(q).replace('.',',');a.oninput=b.oninput=()=>{upd();store()};freeBox.append(d);frees.push({a,b})}
  F.x.forEach(f=>addFree(f[0],f[1]));
  const more=el('<button class="more">+ Добавить, чего нет в списке</button>');more.onclick=()=>addFree();
  const note=el('<textarea placeholder="Комментарий (необязательно)"></textarea>');note.value=F.n||'';note.oninput=store;
  app.append(freeBox,more,note);
  function cur(){const i={};rows.forEach(o=>{if(o.inp.value.trim())i[o.name]=o.inp.value});return{i,x:frees.map(f=>[f.a.value,f.b.value]),n:note.value,u:F.u.slice(),c:{...F.c}}}
  function upd(){rows.forEach(o=>o.r.classList.toggle('on',num(o.inp.value)!==null));const n=filled(cur());$('#cnt').textContent=n?('выбрано '+n):''}
  function store(){S[p]=cur();saveDraft(p)}
  top.querySelector('.back').onclick=()=>{store();staffHome()};
  top.querySelector('.search').oninput=e=>{const v=e.target.value.toLowerCase().trim();rows.forEach(o=>{const show=!v||o.name.toLowerCase().includes(v);o.r.style.display=show?'':'none';o.pnl.style.display=show?'':'none'});heads.forEach(x=>x.style.display=v?'none':'')};
  upd();cta.style.display='block';go.disabled=false;go2.style.display='block';
  const finish=()=>{store();staffHome()};
  go.textContent='Далее ↓';go2.textContent='Готово';
  [go,go2].forEach(b=>b.onpointerdown=e=>e.preventDefault());  // клавиатура не закрывается
  go2.onclick=finish;
  go.onclick=()=>{const vis=rows.filter(o=>o.r.style.display!=='none');
    let i=vis.findIndex(o=>o.inp===document.activeElement);
    const nxt=vis[i+1];
    if(nxt){nxt.inp.focus();nxt.inp.select&&nxt.inp.select();nxt.r.scrollIntoView({block:'center',behavior:'smooth'})}
    else{more.scrollIntoView({block:'center',behavior:'smooth'});finish()}};
}
function staffReview(){
  const ps=toSend();app.innerHTML='';
  const top=el(`<div class="top"><div class="bar"><button class="back">‹</button><h2>Проверьте заявку</h2></div></div>`);
  top.querySelector('.back').onclick=staffHome;app.append(top);
  app.append(el(`<div class="sub" style="margin-top:6px">На ${DATE}. Пока вы не нажали «Всё верно, отправить», ничего не отправлено. Отправили и забыли что-то — откройте заявку снова, добавьте и отправьте: уйдёт вместе с прежним.</div>`));
  ps.forEach(p=>{
    const c=clean(S[p]),card=el('<div class="card"></div>'),n=Object.keys(c.i).length+c.x.length;
    const head=el(`<div class="ch"><div class="ic">${ICON[p]||'📦'}</div><div class="t"><b>${CAT[p].title}</b><small>${n?n+' поз.':'пусто — ничего не нужно'}</small></div></div>`);
    head.onclick=()=>staffPost(p);card.append(head);
    const body=el('<div class="body" style="display:block"></div>');
    Object.keys(c.i).forEach(k=>{const r=el('<div class="row"><div class="nm"></div><b></b></div>');
      r.querySelector('.nm').textContent=((c.u||[]).includes(k)?'⚡ ':'')+k+((c.c||{})[k]?'  💬 '+c.c[k]:'');r.querySelector('b').textContent=fmt(c.i[k]);
      const it=CAT[p].items.find(x=>x[0]===k);const u=it?num(it[1]):null;if(u&&(c.i[k]>u*4||c.i[k]*8<u)){r.querySelector('b').style.color='#e5484d';r.querySelector('.nm').textContent+='  ⚠ обычно '+fmt(u)}body.append(r)});

/* ---------- владелец ---------- */
const RV={'':'',ask:' · ⏳ на проверке',ok:' · ✅ проверено',no:' · ✏️ дополнит'};
function ownerView(D){
  app.innerHTML='';
  app.append(el(`<h1>Заявки постов</h1>`),el(`<div class="sub">На ${D.d} · проверьте и одобрите</div>`));

  const PC=D.pc||{};
  function postTotal(p){const s=D.s[p],st=state[p];let t=0;Object.keys(st.i).forEach(k=>{t+=st.i[k]*((s.pr||{})[k]||0)});return t}
  function warnCount(){let n=0;Object.keys(picked).forEach(p=>{if(!picked[p])return;const s=D.s[p];Object.keys(state[p].i).forEach(k=>{const b=Math.max(+((s.us||{})[k])||0,((s.lw||{})[k]||[0])[0]);if(b&&state[p].i[k]>b*2)n++})});return n}
  function updSum(){let t=0;Object.keys(picked).forEach(p=>{if(picked[p])t+=postTotal(p)});
    const wc=warnCount();
    let tx='Сумма заявки: ~'+mon(t)+' смн';
    if(D.ref)tx+=' · обычно в такой день ~'+mon(D.ref)+' ('+(t>D.ref*1.3?'выше нормы':t<D.ref*0.7?'ниже нормы':'в норме')+')';
    if(wc)tx+='\n⚠ позиций заметно больше обычного: '+wc;
    if(D.hint)tx+='\n'+D.hint;
    sumBox.textContent=tx;
    Object.keys(heads).forEach(p=>{heads[p].textContent=(D.s[p].w||'')+' · '+(D.s[p].t||'')+' · '+(Object.keys(state[p].i).length+state[p].x.length)+' поз. · ~'+mon(postTotal(p))+' смн'+RV[D.s[p].rv||'']})}
  Object.keys(TITLES).forEach(p=>{
    const s=D.s[p];const card=el(`<div class="card${s?'':' off'}"></div>`);
    if(!s){card.append(el(`<div class="ch"><div class="ic">${ICON[p]||'📦'}</div><div class="t"><b>${TITLES[p]}</b><small>ещё не прислали</small></div></div>`));app.append(card);return}
    picked[p]=true;state[p]={i:{...s.i},x:(s.x||[]).map(a=>[...a])};
    const ch=el(`<div class="ch"><div class="ic">${ICON[p]||'📦'}</div><div class="t"><b>${TITLES[p]}</b><small></small></div><div class="chk on">✓</div></div>`);
    heads[p]=ch.querySelector('small');
    const body=el('<div class="body"></div>');
    const ur=s.ur||[],ic=s.ic||{},us=s.us||{},lw=s.lw||{};
    const mk=(name,q,setq,plain)=>{const r=el('<div class="row on"><div class="nm"><span></span><div class="us"></div></div><input type="text" inputmode="decimal"></div>');
      r.querySelector('span').textContent=(ur.includes(name)?'⚡ ':'')+name;
      const bits=[];if(!plain){if(us[name])bits.push('обычно '+us[name]);if(lw[name])bits.push('в прошлый раз '+fmt(lw[name][0])+' ('+lw[name][1]+')');
        if(ur.includes(name))bits.push('срочно');if(ic[name])bits.push('💬 '+ic[name]);if(PC[name])bits.push('цена '+fmt(PC[name][0])+' → '+fmt(PC[name][1]));
        if(!(s.pr||{})[name])bits.push('цены нет')}
      const u=r.querySelector('.us');u.textContent=bits.join(' · ');
      const flag=()=>{const b=Math.max(+us[name]||0,(lw[name]||[0])[0]),v=num(i.value);u.style.color=(!plain&&b&&v&&v>b*2)?'#e5484d':''};
      const i=r.querySelector('input');i.value=fmt(q);flag();i.oninput=()=>{setq(num(i.value));flag();updSum()};body.append(r)};
    const keys=Object.keys(s.i).sort((a,b)=>(ur.includes(b)?1:0)-(ur.includes(a)?1:0));
    keys.forEach(k=>mk(k,s.i[k],v=>{if(v===null)delete state[p].i[k];else state[p].i[k]=v}));
    (s.x||[]).forEach((a,idx)=>mk(a[0]+' (своя)',a[1],v=>{state[p].x[idx][1]=v},true));
    if(s.n){const nn=el('<div class="note"></div>');nn.textContent='💬 '+s.n;body.append(nn)}
    if(s.rv==='no'||s.rv==='ok'||s.rv==='ask'){const rr=el('<div class="note"></div>');rr.textContent={ok:'✅ Сотрудник подтвердил: всё правильно',no:'✏️ Сотрудник дополнит заявку',ask:'⏳ Отправлено на проверку, ответа ещё нет'}[s.rv];body.append(rr)}
    const rb=el('<button class="tab" style="width:100%;margin-top:10px;padding:12px">📨 Отправить на проверку</button>');
    rb.onclick=e=>{e.stopPropagation();const st=state[p];send({a:2,d:D.d,p,i:st.i,x:st.x.filter(a=>a[1]!==null)})};body.append(rb);
    const box=ch.querySelector('.chk');
    box.onclick=e=>{e.stopPropagation();picked[p]=!picked[p];box.classList.toggle('on',picked[p]);card.classList.toggle('off',!picked[p]);updO()};
    ch.onclick=()=>card.classList.toggle('open');
    card.append(ch,body);app.append(card)});
  function updO(){const k=Object.keys(picked).filter(p=>picked[p]).length;go.disabled=!k;go.textContent=k?`Одобрить и собрать · ${k}`:'Выберите заявки';updSum()}
  kbDone();updO();go2.style.display='none';cta.style.display='block';
  go.onclick=()=>{const s={};Object.keys(picked).filter(p=>picked[p]).forEach(p=>{const st=state[p];s[p]={i:st.i,x:st.x.filter(a=>a[1]!==null)}});send({a:1,d:D.d,s})};
}

/* ---------- редактор списка товаров и цен (владелец) ---------- */
const SECS=['МЕХРГОН','МАГАЗИН','ГУШТ','ЗЕЛЕНЬ','БАР','ПРОЧЕЕ'];
let E={},E0={},curP='ПОВАР',edScroll=0;
async function deflate(o){const cs=new CompressionStream('deflate-raw');const w=cs.writable.getWriter();w.write(new TextEncoder().encode(JSON.stringify(o)));w.close();
  const u=new Uint8Array(await new Response(cs.readable).arrayBuffer());let s='';u.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function editor(D){
  E={};E0={};Object.keys(TITLES).forEach(p=>{E[p]=(D[p]||[]).map(a=>({name:a[0],sec:a[1],price:a[2],usual:a[3],group:a[4]||'Другое',xname:a[5]||'',par:a[6]||null,cycle:a[7]||null,orig:a[0]}));E0[p]=JSON.stringify(E[p])});

}
function changedPosts(){return Object.keys(E).filter(p=>JSON.stringify(E[p])!==E0[p])}
function groupsOf(p){const g=[];E[p].forEach(it=>{let x=g.find(y=>y.name===it.group);if(!x){x={name:it.group,items:[]};g.push(x)}x.items.push(it)});return g}

function priceStr(v){return v===null||v===undefined?'':String(v).replace('.',',')}
function pnum(v){v=String(v).replace(',','.').trim();if(!v)return null;const n=parseFloat(v);return isFinite(n)&&n>=0?n:null}
function updSave(){const n=changedPosts().length;go.disabled=!n;go.textContent=n?`Сохранить изменения (${n})`:'Нет изменений'}
function edTab(p){
  curP=p;app.innerHTML='';

  function markTab(){[...tabs.children].forEach((t,i)=>{const q=Object.keys(TITLES)[i];t.textContent=`${ICON[q]} ${TITLES[q]}${E0[q]!==JSON.stringify(E[q])?' •':''}`})}

  window.scrollTo(0,edScroll);
}

function edSheet(p,it,isNew){

  const groups=groupsOf(p).map(g=>g.name);if(!groups.includes(it.group))groups.push(it.group);
  const ov=el(`<div class="ov"><div class="sheet">
    <h3>${isNew?'Новый товар':'Товар'}</h3>
    <label>Название<input id="f_n" type="text"></label>
    <div class="two2"><label>Цена, смн<input id="f_p" type="text" inputmode="decimal"></label><label>Обычно (кол-во)<input id="f_u" type="text" inputmode="decimal"></label></div>
    <label>Раздел в таблице заявки<select id="f_s"></select></label>
    <label>Группа в списке<select id="f_g"></select></label>
    <div class="two2"><label>Закупать за раз (шт)<input id="f_par" type="text" inputmode="decimal"></label><label>Раз в сколько дней<input id="f_cyc" type="text" inputmode="decimal"></label></div>
    <div class="two2"><button id="f_up">↑ Выше</button><button id="f_dn">↓ Ниже</button></div>
    <div class="two2"><button id="f_del" class="danger">Удалить</button><button id="f_ok" class="okb">Готово</button></div>
  </div></div>`);
  document.body.append(ov);
  const $$=s=>ov.querySelector(s);
  $$('#f_par').value=priceStr(it.par);$$('#f_cyc').value=priceStr(it.cycle);$$('#f_n').value=it.name;$$('#f_p').value=priceStr(it.price);$$('#f_u').value=priceStr(it.usual);
  SECS.forEach(s=>{const o=document.createElement('option');o.textContent=s;if(s===it.sec)o.selected=true;$$('#f_s').append(o)});
  groups.forEach(g=>{const o=document.createElement('option');o.textContent=g;if(g===it.group)o.selected=true;$$('#f_g').append(o)});
  const on=document.createElement('option');on.textContent='+ Новая группа…';on.value='__new';$$('#f_g').append(on);
  function apply(){it.name=$$('#f_n').value.trim();it.price=pnum($$('#f_p').value);it.usual=pnum($$('#f_u').value);it.sec=$$('#f_s').value;it.par=pnum($$('#f_par').value);it.cycle=pnum($$('#f_cyc').value);if(!(it.par&&it.cycle)){it.par=null;it.cycle=null}
    const g=$$('#f_g').value;if(g==='__new'){const n=prompt('Название новой группы');if(n&&n.trim())it.group=n.trim()}else it.group=g}
  function close(){ov.remove()}
  function move(dir){apply();const g=groupsOf(p);const gr=g.find(x=>x.name===it.group);if(!gr)return;const i=gr.items.indexOf(it);const j=i+dir;
    if(j>=0&&j<gr.items.length){gr.items.splice(i,1);gr.items.splice(j,0,it);flat(p,g)}close();edKeep(p);edSheet(p,it,isNew)}
  $$('#f_up').onclick=()=>move(-1);$$('#f_dn').onclick=()=>move(1);
  $$('#f_del').onclick=()=>{if(confirm('Удалить «'+(it.name||'товар')+'» из списка?')){E[p]=E[p].filter(x=>x!==it);close();edKeep(p)}};
  $$('#f_ok').onclick=()=>{apply();if(!it.name){E[p]=E[p].filter(x=>x!==it)}else if(E[p].some(x=>x!==it&&x.name.toLowerCase()===it.name.toLowerCase())){alert('Такой товар уже есть в этом списке');return}
    // порядок: новая группа/смена группы — товар в конец своей группы
    const g=groupsOf(p);flat(p,g);close();edKeep(p)};
}
async function edSave(){
  const ps=changedPosts();if(!ps.length)return;
  const bad=ps.map(p=>E[p].find(i=>!i.name)).filter(Boolean);if(bad.length){alert('Есть товар без названия');return}
  const out={};ps.forEach(p=>{out[p]=E[p].map(i=>[i.name,i.sec,i.price,i.usual,i.group,i.xname||'',i.par||null,i.cycle||null,i.orig||''])});
  const z=await deflate(out);
  if(z.length>3900){if(ps.length>1&&ps.includes(curP)){const z2=await deflate({[curP]:out[curP]});if(z2.length<=3900&&confirm('Изменений много: сохраню только вкладку «'+TITLES[curP]+'». Остальные правки повторите после. Сохранить?')){go.disabled=true;send({e:1,z:z2});return}}alert('Слишком много изменений сразу. Сохраните по одной вкладке.');return}
  go.disabled=true;send({e:1,z});
}

(async()=>{
  // Телеграм дописывает в хвост ссылки свои параметры (&tgWebAppData=…), поэтому разбираем хэш по '&'
  const P={};location.hash.replace(/^#/,'').split('&').forEach(x=>{const k=x.indexOf('=');if(k>0)P[x.slice(0,k)]=x.slice(k+1)});
  try{
    if(P.e){ if(!window.DecompressionStream)throw 'Обновите Telegram';editor(await inflate(P.e))}
    else if(P.o){ if(!window.DecompressionStream)throw 'Обновите Telegram';ownerView(await inflate(P.o))}
    else if(P.d){ if(!window.DecompressionStream)throw 'Обновите Telegram';draftView(await inflate(P.d))}
    else if(P.s!==undefined){let R={};
      if(!P.c||!window.DecompressionStream)throw 'Обновите Telegram и откройте заявку снова';
      if(P.y){try{Y=await inflate(P.y)}catch(e){}}
      if(P.u){try{U=await inflate(P.u)}catch(e){}}
      if(P.w){try{W=await inflate(P.w)}catch(e){}}
      const C0=await inflate(P.c);Object.keys(C0).forEach(k=>{CAT[k]={title:C0[k].t,items:C0[k].i}});
      const now=new Date();if(now.getHours()>=5)now.setDate(now.getDate()+1);
      const date=String(now.getDate()).padStart(2,'0')+'.'+String(now.getMonth()+1).padStart(2,'0');  // как у бота: после 05:00 — на завтра
      if(P.r&&window.DecompressionStream){try{const z=await inflate(P.r);const old=z.p===undefined;const zd=old?decodeURIComponent(P.s):z.d;if(zd===date)R=old?z:z.p}catch(e){}}
      staffInit(date,R);staffHome()}
    else throw 'Откройте заявку кнопкой в боте.';
  }catch(e){app.innerHTML='<div id="err">Не получилось открыть: '+e+'<br><br>Закройте и откройте снова кнопкой в боте.</div>'}
})();
